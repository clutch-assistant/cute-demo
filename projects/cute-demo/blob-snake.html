<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐍 BLOB SNAKE 🐍 - Blobby's World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-title {
            color: #00ff88;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-shadow: 3px 3px 0 #ff00ff, 6px 6px 0 #000;
            animation: pulse 1s infinite alternate;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .score-display {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            color: #fff;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
        }

        .score-box {
            background: #000;
            border: 3px solid #00ff88;
            padding: 8px 20px;
            border-radius: 5px;
        }

        #gameCanvas {
            border: 5px solid #ff00ff;
            background: #0a0a1a;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5), inset 0 0 50px rgba(0, 255, 136, 0.1);
            max-width: 95vw;
            max-height: 60vh;
        }

        .controls {
            margin-top: 15px;
            display: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .controls {
                display: grid;
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(3, 60px);
                gap: 5px;
            }
        }

        .control-btn {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border: 3px solid #00ff88;
            border-radius: 10px;
            color: #00ff88;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background: linear-gradient(180deg, #00ff88 0%, #00aa55 100%);
            color: #000;
        }

        .control-up { grid-column: 2; }
        .control-left { grid-column: 1; grid-row: 2; }
        .control-right { grid-column: 3; grid-row: 2; }
        .control-down { grid-column: 2; grid-row: 3; }

        .instructions {
            color: #888;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            margin-top: 15px;
            text-align: center;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 5px solid #ff00ff;
            padding: 40px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            color: #ff00ff;
            font-size: clamp(1.5rem, 5vw, 2rem);
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #00ff88;
        }

        .start-btn {
            background: linear-gradient(180deg, #00ff88 0%, #00aa55 100%);
            border: none;
            padding: 15px 40px;
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            animation: glow 1s infinite alternate;
            font-family: 'Courier New', monospace;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px #00ff88; }
            to { box-shadow: 0 0 30px #00ff88, 0 0 50px #00ff88; }
        }

        .final-score {
            color: #ffff00;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1 class="game-title">🐍 BLOB SNAKE 🐍</h1>

    <div class="score-display">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="score-box">HIGH: <span id="highScore">0</span></div>
        <div class="score-box">LEVEL: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Touch Controls for Mobile -->
    <div class="controls">
        <button class="control-btn control-up" id="btnUp">▲</button>
        <button class="control-btn control-left" id="btnLeft">◀</button>
        <button class="control-btn control-right" id="btnRight">▶</button>
        <button class="control-btn control-down" id="btnDown">▼</button>
    </div>

    <p class="instructions">Use ARROW KEYS or TOUCH to move • Eat food to grow!</p>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <h2>🐍 BLOB SNAKE 🐍</h2>
        <p style="color: #00ff88; margin-bottom: 20px;">Guide your blob to eat the tasty treats!</p>
        <button class="start-btn" id="startBtn">START GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over-screen hidden" id="gameOverScreen">
        <h2>GAME OVER!</h2>
        <div class="final-score">SCORE: <span id="finalScore">0</span></div>
        <button class="start-btn" id="restartBtn">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas sizing
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth * 0.95, 400);
            const maxHeight = Math.min(window.innerHeight * 0.6, 400);
            const size = Math.min(maxWidth, maxHeight);
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game state
        let snake = [];
        let food = { x: 10, y: 10 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('blobSnakeHighScore') || 0;
        let level = 1;
        let gameSpeed = 100;
        let gameLoop = null;
        let isPlaying = false;

        // Colors for snake segments (rainbow blob theme)
        const blobColors = [
            '#ff00ff', '#00ffff', '#ffff00', '#ff6600',
            '#00ff88', '#ff0066', '#9900ff', '#00ff00'
        ];

        // DOM elements
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const levelEl = document.getElementById('level');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        highScoreEl.textContent = highScore;

        // Initialize snake
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            level = 1;
            gameSpeed = 100;
            spawnFood();
            updateUI();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function updateUI() {
            scoreEl.textContent = score;
            highScoreEl.textContent = highScore;
            levelEl.textContent = level;
        }

        // Draw a cute blob shape
        function drawBlob(x, y, color, isHead = false) {
            const px = x * gridSize;
            const py = y * gridSize;
            const centerX = px + gridSize / 2;
            const centerY = py + gridSize / 2;
            const radius = gridSize / 2 - 2;

            ctx.save();

            // Glow effect
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;

            // Blob body
            ctx.fillStyle = color;
            ctx.beginPath();

            if (isHead) {
                // Eyes for head
                const eyeOffset = direction.x * 2;
                ctx.arc(centerX, centerY - 2, radius, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(centerX - 4 + eyeOffset, centerY - 3, 4, 0, Math.PI * 2);
                ctx.arc(centerX + 4 + eyeOffset, centerY - 3, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(centerX - 4 + eyeOffset, centerY - 3, 2, 0, Math.PI * 2);
                ctx.arc(centerX + 4 + eyeOffset, centerY - 3, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY + 2, 5, 0.1 * Math.PI, 0.9 * Math.PI);
                ctx.stroke();
            } else {
                // Body segments with slight wobble
                const wobble = Math.sin(Date.now() / 200 + x + y) * 2;
                ctx.ellipse(centerX, centerY, radius + wobble * 0.5, radius - wobble * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Draw food
        function drawFood() {
            const px = food.x * gridSize;
            const py = food.y * gridSize;
            const centerX = px + gridSize / 2;
            const centerY = py + gridSize / 2;

            // Pulsing glow
            const pulse = Math.sin(Date.now() / 150) * 5;

            ctx.save();
            ctx.shadowColor = '#ff0066';
            ctx.shadowBlur = 15 + pulse;

            // Star/sparkle shape
            ctx.fillStyle = '#ff0066';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const r = i % 2 === 0 ? 8 : 4;
                const x = centerX + Math.cos(angle) * r;
                const y = centerY + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            // Inner highlight
            ctx.fillStyle = '#ff99aa';
            ctx.beginPath();
            ctx.arc(centerX - 2, centerY - 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Draw grid (subtle)
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function update() {
            direction = { ...nextDirection };

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall collision (wrap around)
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // Self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10 * level;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('blobSnakeHighScore', highScore);
                }

                // Level up every 100 points
                const newLevel = Math.floor(score / 100) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    gameSpeed = Math.max(50, 100 - (level - 1) * 10);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }

                updateUI();
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            // Draw snake
            snake.forEach((segment, index) => {
                const color = blobColors[index % blobColors.length];
                drawBlob(segment.x, segment.y, color, index === 0);
            });

            // Draw food
            drawFood();
        }

        function gameStep() {
            update();
            draw();
        }

        function startGame() {
            initGame();
            isPlaying = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            draw();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }

        // Input handling
        function handleDirection(newDir) {
            if (!isPlaying) return;

            // Prevent opposite direction
            if (newDir.x !== -direction.x && newDir.y !== -direction.y) {
                nextDirection = newDir;
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    handleDirection({ x: 0, y: -1 });
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    handleDirection({ x: 0, y: 1 });
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    handleDirection({ x: -1, y: 0 });
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    handleDirection({ x: 1, y: 0 });
                    e.preventDefault();
                    break;
            }
        });

        // Touch controls
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); handleDirection({ x: 0, y: -1 }); });
        btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); handleDirection({ x: 0, y: 1 }); });
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleDirection({ x: -1, y: 0 }); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleDirection({ x: 1, y: 0 }); });

        // Also support click for testing on desktop
        btnUp.addEventListener('click', () => handleDirection({ x: 0, y: -1 }));
        btnDown.addEventListener('click', () => handleDirection({ x: 0, y: 1 }));
        btnLeft.addEventListener('click', () => handleDirection({ x: -1, y: 0 }));
        btnRight.addEventListener('click', () => handleDirection({ x: 1, y: 0 }));

        // Button handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Initial draw
        initGame();
        draw();
    </script>
</body>
</html>
