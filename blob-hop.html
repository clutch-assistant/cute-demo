<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🩷 Blob Hop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            border: 4px solid #e94560;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
            background: #0f0f23;
        }
        .info {
            color: #fff;
            text-align: center;
            margin-top: 15px;
        }
        .score {
            font-size: 1.5rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.8);
        }
        .controls {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 10px;
        }
        .title {
            font-size: 2.5rem;
            color: #e94560;
            text-shadow: 3px 3px 0 #0f3460, 6px 6px 0 rgba(233, 69, 96, 0.5);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="title">🩷 Blob Hop</div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div class="info">
        <div class="score">SCORE: <span id="scoreDisplay">0</span> | HIGH: <span id="highScoreDisplay">0</span></div>
        <div class="controls">← → or A/D to move | SPACE/↑ to jump | Touch left/right sides</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let highScore = parseInt(localStorage.getItem('blobHopHighScore')) || 0;
        let gameOver = false;
        let gameStarted = false;

        document.getElementById('highScoreDisplay').textContent = highScore;

        // Player
        const player = {
            x: 180,
            y: 400,
            width: 40,
            height: 40,
            velocityX: 0,
            velocityY: 0,
            speed: 6,
            jumpPower: -14,
            gravity: 0.6,
            grounded: false,
            color: '#e94560'
        };

        // Platforms
        const platforms = [];
        const platformWidth = 80;
        const platformHeight = 15;

        // Stars (collectibles)
        const stars = [];

        // Input state
        const keys = {
            left: false,
            right: false,
            jump: false
        };

        // Touch controls
        let touchLeft = false;
        let touchRight = false;

        function createPlatform(y) {
            return {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                width: platformWidth,
                height: platformHeight,
                type: Math.random() > 0.9 ? 'moving' : (Math.random() > 0.8 ? 'breakable' : 'normal')
            };
        }

        function initPlatforms() {
            platforms.length = 0;
            // Ground platform
            platforms.push({ x: 0, y: canvas.height - 30, width: canvas.width, height: 30, type: 'ground' });
            // Starting platform
            platforms.push({ x: 150, y: 400, width: platformWidth, height: platformHeight, type: 'normal' });

            // Generate platforms upward
            for (let y = 350; y > -500; y -= 70) {
                platforms.push(createPlatform(y));
            }
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < 20; i++) {
                stars.push({
                    x: Math.random() * (canvas.width - 30) + 15,
                    y: Math.random() * 400 + 50,
                    collected: false,
                    rotation: Math.random() * Math.PI * 2
                });
            }
        }

        function resetGame() {
            player.x = 180;
            player.y = 400;
            player.velocityX = 0;
            player.velocityY = 0;
            player.grounded = false;
            score = 0;
            gameOver = false;
            initPlatforms();
            initStars();
        }

        // Input handlers
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
                e.preventDefault();
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                if (player.grounded) {
                    player.velocityY = player.jumpPower;
                    player.grounded = false;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
                e.preventDefault();
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
                e.preventDefault();
            }
        });

        // Touch controls
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted) {
                gameStarted = true;
                resetGame();
                return;
            }
            handleTouch(e.touches);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleTouch(e.touches);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchLeft = false;
            touchRight = false;
        }, { passive: false });

        function handleTouch(touches) {
            const rect = canvas.getBoundingClientRect();
            const midX = rect.width / 2;

            for (let i = 0; i < touches.length; i++) {
                const touchX = touches[i].clientX - rect.left;

                if (touchX < midX) {
                    touchLeft = true;
                    touchRight = false;
                } else {
                    touchLeft = false;
                    touchRight = true;
                }
            }

            // Jump on tap when grounded
            if (player.grounded && touches.length === 1) {
                player.velocityY = player.jumpPower;
                player.grounded = false;
            }
        }

        function update() {
            if (gameOver || !gameStarted) return;

            // Horizontal movement
            player.velocityX = 0;
            if (keys.left || touchLeft) player.velocityX = -player.speed;
            if (keys.right || touchRight) player.velocityX = player.speed;

            player.x += player.velocityX;

            // Screen wrap
            if (player.x + player.width < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.width;

            // Gravity
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // Platform collision
            player.grounded = false;
            for (const platform of platforms) {
                if (platform.type === 'breakable' && platform.broken) continue;

                if (player.velocityY > 0 &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + player.velocityY &&
                    player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width) {

                    player.y = platform.y - player.height;
                    player.velocityY = 0;
                    player.grounded = true;

                    if (platform.type === 'breakable' && !platform.broken) {
                        platform.broken = true;
                        score += 5;
                    }
                    break;
                }
            }

            // Moving platforms
            for (const platform of platforms) {
                if (platform.type === 'moving') {
                    if (!platform.direction) platform.direction = 1;
                    if (!platform.moveX) platform.moveX = platform.x;

                    platform.moveX += platform.direction * 2;
                    if (platform.moveX > canvas.width - platformWidth || platform.moveX < 0) {
                        platform.direction *= -1;
                    }
                    platform.x = platform.moveX;

                    if (player.grounded && platforms.includes(platform)) {
                        player.x += platform.direction * 2;
                    }
                }
            }

            // Star collection
            for (const star of stars) {
                if (!star.collected) {
                    const dx = (player.x + player.width / 2) - star.x;
                    const dy = (player.y + player.height / 2) - star.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 30) {
                        star.collected = true;
                        score += 10;
                        document.getElementById('scoreDisplay').textContent = score;
                    }
                }
            }

            // Fall death
            if (player.y > canvas.height + 50) {
                gameOver = true;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('blobHopHighScore', highScore);
                    document.getElementById('highScoreDisplay').textContent = highScore;
                }
            }

            // Scroll platforms down when player goes high
            if (player.y < 200) {
                const scroll = 200 - player.y;
                player.y = 200;
                for (const platform of platforms) {
                    if (platform.type !== 'ground') {
                        platform.y += scroll;
                    }
                }
                for (const star of stars) {
                    if (!star.collected) {
                        star.y += scroll;
                    }
                }

                // Remove off-screen platforms and add new ones
                while (platforms.length > 0 && platforms[platforms.length - 1].y > 100) {
                    platforms.pop();
                }
                while (platforms.length < 15) {
                    const topPlatform = platforms[platforms.length - 1];
                    if (topPlatform) {
                        platforms.push(createPlatform(topPlatform.y - 70));
                    }
                }
            }

            // Remove off-screen stars and add new ones
            while (stars.length > 0 && stars[stars.length - 1].y > canvas.height + 50) {
                stars.pop();
            }
            while (stars.length < 15) {
                stars.push({
                    x: Math.random() * (canvas.width - 30) + 15,
                    y: -50 - Math.random() * 100,
                    collected: false,
                    rotation: Math.random() * Math.PI * 2
                });
            }
        }

        function drawBlob(x, y, size, color) {
            // Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(x + size/2, y + size/2, size/2, size/2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(x + size/3, y + size/3, size/6, size/8, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + size/3, y + size/2.5, 6, 0, Math.PI * 2);
            ctx.arc(x + size*2/3, y + size/2.5, 6, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + size/3 + 2, y + size/2.5, 3, 0, Math.PI * 2);
            ctx.arc(x + size*2/3 + 2, y + size/2.5, 3, 0, Math.PI * 2);
            ctx.fill();

            // Smile
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2.2, 8, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 73) % canvas.width;
                const y = (i * 47 + Date.now() / 50) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Draw platforms
            for (const platform of platforms) {
                if (platform.type === 'ground') {
                    ctx.fillStyle = '#4a4a6a';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                } else if (platform.type === 'moving') {
                    ctx.fillStyle = '#3498db';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    ctx.strokeStyle = '#2980b9';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
                } else if (platform.type === 'breakable') {
                    if (!platform.broken) {
                        ctx.fillStyle = '#e67e22';
                        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                        // Cracks
                        ctx.strokeStyle = '#d35400';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(platform.x + 10, platform.y);
                        ctx.lineTo(platform.x + 20, platform.y + platform.height);
                        ctx.moveTo(platform.x + 40, platform.y);
                        ctx.lineTo(platform.x + 50, platform.y + platform.height);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = '#9b59b6';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    ctx.strokeStyle = '#8e44ad';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
                }
            }

            // Draw stars
            for (const star of stars) {
                if (!star.collected) {
                    ctx.save();
                    ctx.translate(star.x, star.y);
                    ctx.rotate(Date.now() / 500 + star.rotation);

                    // Star shape
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 12,
                                   -Math.sin((18 + i * 72) * Math.PI / 180) * 12);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 5,
                                   -Math.sin((54 + i * 72) * Math.PI / 180) * 5);
                    }
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Draw player
            drawBlob(player.x, player.y, player.width, player.color);

            // Game over screen
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, 200);

                ctx.fillStyle = '#fff';
                ctx.font = '24px Courier New';
                ctx.fillText(`Score: ${score}`, canvas.width/2, 260);
                if (score >= highScore && score > 0) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillText('🏆 NEW HIGH SCORE! 🏆', canvas.width/2, 310);
                } else {
                    ctx.fillText(`High Score: ${highScore}`, canvas.width/2, 310);
                }

                ctx.fillStyle = '#aaa';
                ctx.font = '18px Courier New';
                ctx.fillText('Tap or press SPACE to restart', canvas.width/2, 380);
            }

            // Start screen
            if (!gameStarted && !gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 36px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('🩷 BLOB HOP 🩷', canvas.width/2, 180);

                ctx.fillStyle = '#fff';
                ctx.font = '20px Courier New';
                ctx.fillText('Jump between platforms!', canvas.width/2, 230);
                ctx.fillText('Collect stars for points!', canvas.width/2, 260);

                ctx.fillStyle = '#aaa';
                ctx.font = '16px Courier New';
                ctx.fillText('← → or A/D to move', canvas.width/2, 320);
                ctx.fillText('SPACE or ↑ to jump', canvas.width/2, 350);
                ctx.fillText('Touch left/right sides to move', canvas.width/2, 380);

                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 24px Courier New';
                ctx.fillText('TAP TO START', canvas.width/2, 440);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Restart handler
        document.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && gameOver) {
                gameStarted = true;
                resetGame();
            }
        });

        canvas.addEventListener('touchend', (e) => {
            if (gameOver) {
                gameStarted = true;
                resetGame();
            }
        });

        // Start
        initPlatforms();
        initStars();
        gameLoop();
    </script>
</body>
</html>
